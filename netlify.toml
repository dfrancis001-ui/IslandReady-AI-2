# IslandReady AI — Netlify build configuration (monorepo layout).
# Netlify builds from the repository root; the Next.js application lives in
# islandready-app/ and its build output is islandready-app/.next. Netlify's
# automatic OpenNext support detects the Next.js app during the build — do NOT
# pin the legacy @netlify/plugin-nextjs. Secrets (DATABASE_URL,
# NEXTAUTH_SECRET, NEXTAUTH_URL, OLLAMA_*) belong in the Netlify dashboard
# environment settings, never in this file.
[build]
  base = "/"
  command = "cd islandready-app && npm run build"
  publish = "islandready-app/.next"
