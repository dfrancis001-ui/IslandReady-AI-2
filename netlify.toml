# IslandReady AI — Netlify build configuration.
# The base MUST be islandready-app/: Netlify installs dependencies from the
# package.json at the base, and only islandready-app/ has one (Next.js 16.3.8
# in dependencies). With a root base, nothing is installed and the build
# fails with "Next not found". Publish is relative to the base. The OpenNext
# adapter (automatic, unpinned) then provisions the server/edge deployment.
# Do NOT pin the legacy @netlify/plugin-nextjs. Secrets (DATABASE_URL,
# NEXTAUTH_SECRET, NEXTAUTH_URL, OLLAMA_*) belong in the Netlify dashboard
# environment settings, never in this file.
[build]
  base = "islandready-app"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Serverless-safe defaults (no Ollama server / no persistent disk on Netlify).
  # Owner can override to "true" in the Netlify dashboard when ready.
  FEATURE_AI = "false"
  FEATURE_UPLOADS = "false"

# Production URL for next-auth callbacks. Secrets (DATABASE_URL,
# NEXTAUTH_SECRET) must still be set in the Netlify dashboard.
[context.production.environment]
  NEXTAUTH_URL = "https://remarkable-chebakia-d1fb1d.netlify.app"

# PWA: correct MIME for the web manifest; service worker must revalidate
# so clients pick up shell updates instead of serving a stale sw.js.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
