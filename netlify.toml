# IslandReady AI — Netlify build configuration (monorepo layout).
# Netlify-recommended setup: package directory = islandready-app (set in the
# dashboard), base = repository root. Build and publish paths below are
# relative to the root. The OpenNext adapter (automatic, unpinned) detects the
# Next.js app via the package directory and provisions the server/edge
# deployment. Do NOT pin the legacy @netlify/plugin-nextjs. Secrets
# (DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL, OLLAMA_*) belong in the
# Netlify dashboard environment settings, never in this file.
[build]
  base = "/"
  command = "cd islandready-app && npm run build"
  publish = "islandready-app/.next"
